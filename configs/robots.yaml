# Robot configuration for the rebuilt 8-CR5A cell.
#
# New numbering after the line rebuild:
#   R1-R3  left workspace (former display copy R6-R8)
#   R4-R6  former R1-R3 (middle workspace)
#   R7-R8  former R4-R5 (screw / sort)
#
# Product: real control-cabinet assembly (STL models, 50% scale).

robots:
  R1:
    name: "Cabinet shell loading and pallet-location robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-3.60, 0.75, 0.19]
    base_object: /R1/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R1_HOME_REF
    capabilities: [shell_load, pallet_locate, pick_and_place]
    assigned_parts: [shell]
    end_effector: gripper
    work_area: [cabinet_conveyor_area, public_workspace_1]
    tip: R1_gripper_tip

  R2:
    name: "Horizontal rail magnetic-installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-3.07, -0.48, 0.19]
    base_object: /R2/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R2_HOME_REF
    capabilities: [horizontal_rail_install, magnetic_pick_and_place]
    assigned_parts: [rail_h1]
    end_effector: magnetic_gripper
    work_area: [r2_stand_area, public_workspace_1]
    tip: R2_vacuum_tip

  R3:
    name: "Dual vertical-rail installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-2.75, -0.15, 0.19]
    base_object: /R3/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R3_HOME_REF
    capabilities: [vertical_rail_install, precision_pick_and_place]
    assigned_parts: [rail_v1, rail_v2]
    end_effector: magnetic_gripper
    work_area: [r3_rack_area, public_workspace_1]
    tip: R3_gripper_tip

  R4:
    name: "Power and drive device installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-1.30, 0.70, 0.19]
    base_object: /R4/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R4_HOME_REF
    capabilities: [power_device_install, drive_device_install, pick_and_place]
    assigned_parts: [psu, servo, eds]
    end_effector: gripper
    work_area: [public_workspace_2]
    tip: R4_gripper_tip

  R5:
    name: "Control-device vacuum-installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-1.56, -0.22, 0.19]
    base_object: /R5/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R5_HOME_REF
    capabilities: [control_device_install, vacuum_pick_and_place]
    assigned_parts: [plc, dma]
    end_effector: vacuum
    work_area: [r5_basket_area, public_workspace_2]
    tip: R5_vacuum_tip

  R6:
    name: "Switching and protection installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [-0.50, -0.08, 0.19]
    base_object: /R6/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R6_HOME_REF
    capabilities: [switch_device_install, protection_device_install, pick_and_place]
    assigned_parts: [contactor, breaker]
    end_effector: gripper
    work_area: [r6_basket_area, public_workspace_2]
    tip: R6_gripper_tip

  R7:
    name: "Four-point internal fastening robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [0.10, 0.75, 0.19]
    base_object: /R7/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R7_HOME_REF
    capabilities: [four_point_fastening, torque_control]
    assigned_parts: []
    end_effector: screwdriver
    work_area: [public_workspace_3]
    tip: R7_tool_tip

  R8:
    name: "Communication module and filter installation robot"
    model: DOBOT CR5A
    model_file: cr5_robot_fixed.urdf
    position: [0.35, -0.22, 0.19]
    base_object: /R8/base_link_respondable
    home_pose: [0, 0, 0, 0, 0, 0]
    home_point: R8_HOME_REF
    capabilities: [communication_module_install, filter_install, vacuum_pick_and_place]
    assigned_parts: [com5, filter]
    end_effector: vacuum
    work_area: [r8_device_supply_area, public_workspace_3]
    tip: R8_vacuum_tip
