notes:
- 'Scene produced by scripts/rename_scene_robots.py, scripts/build_new_line_scene.py
  and scripts/build_cabinet_product_scene.py: real control-cabinet STL product at
  50% scale, displayed as an OPEN-TOP box. The three obsolete 1.9 m round tables and
  detached R1_Base..R8_Base discs are removed and replaced by eight square, floor-to-base-link
  pedestals. Three shared workspaces are marked along the unobstructed indexing conveyor:
  R1/R2/R3, R4/R5/R6, and R6/R7/R8. The reference cabinet is on a compact display
  riser outside those workspaces. Task-owned R4/R5/R6/R8 device baskets are present;
  all task actions have paired vertical APP/TCP targets, and all eight robot roots
  are clear of the conveyor.'
- After R3 installs vertical rail A at WB1, the pallet and assembly advance 0.12 m
  along world +X to wb1_micro before rail B; the R3-B APP/TCP pair includes the same
  offset.
- After R5 installs DMA at WB2, the pallet and assembly advance 0.12 m along world
  +X to wb2_micro before R6 installs Contactor and Breaker; both placement APP/TCP
  pairs include the same offset. R8 then installs COM5 and Filter at staging.
