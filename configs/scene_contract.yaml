- 'Scene produced by scripts/rename_scene_robots.py, scripts/build_new_line_scene.py
  and scripts/build_cabinet_product_scene.py: real control-cabinet STL product at
  50% scale, displayed as an OPEN-TOP box. The three obsolete 1.9 m round tables and
  detached R1_Base..R8_Base discs are removed. Three shared workspaces are marked
  along the unobstructed indexing conveyor: R1/R2/R3, R4/R5/R6, and R6/R7/R8. The
  reference cabinet is on a compact display riser outside those workspaces. Task-owned
  R4/R5/R6 device baskets and the R8 door supply are present; all 33 task actions
  have paired vertical APP/TCP targets, and all eight robot roots are clear of the
  conveyor.'
