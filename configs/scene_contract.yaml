  along world +X to wb1_micro before rail B; the R3-B APP/TCP pair includes the same
  offset.
- After R5 installs Filter at WB2, the pallet and assembly advance 0.12 m along world
  +X to wb2_micro before R6 installs Contactor and Breaker; both placement APP/TCP
  pairs include the same offset. R6 then installs COM5 at staging.
